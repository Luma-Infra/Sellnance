<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LWC v5 Native Multi-Pane + Kimchi Premium (BTC)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/z_style.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0e14;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 10px 20px;
      background: #121721;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .coin-btn {
      background: #1f293d;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .coin-btn:hover {
      background: #2b3a55;
      color: #ffffff;
    }
    .coin-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .kimp-btn {
      background: rgba(255, 0, 122, 0.12);
      color: #ff007a;
      border: 1px solid rgba(255, 0, 122, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kimp-btn.active {
      background: #ff007a;
      color: #ffffff;
      border-color: #ff007a;
      box-shadow: 0 0 12px rgba(255, 0, 122, 0.4);
    }
    #chart-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .info-badge {
      font-size: 11px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      border-radius: 9999px;
      font-weight: 500;
    }
    .notice-bar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 7px 20px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    .notice-bar strong {
      color: #38bdf8;
    }
    .notice-bar .kimp-tag {
      color: #ff007a;
      font-weight: 700;
    }
  </style>
  <script src="/static/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <h2 style="margin:0; font-size:16px; font-weight:700; color:#f8fafc;">
        🔥 TradingView v5 단일 차트 (캔들 + 볼륨 + 김프 통합 POC)
      </h2>
      <span class="info-badge">좌/우 축 동기화 코드 0줄 (100% 트뷰 네이티브)</span>
    </div>
    <div class="btn-group">
      <button class="kimp-btn active" id="btn-kimp" onclick="toggleKimchi()">
        <span style="font-size:11px;">●</span> 김프 (KIMP) 표시 중
      </button>
      <div style="width:1px; height:20px; background:#334155; margin:0 4px;"></div>
      <button class="coin-btn active" id="btn-btc" onclick="switchCoin('BTC')">BTC (~1억대)</button>
      <button class="coin-btn" id="btn-doge" onclick="switchCoin('DOGE')">DOGE (~200원대)</button>
      <button class="coin-btn" id="btn-shib" onclick="switchCoin('SHIB')">SHIB (~0.02원대)</button>
    </div>
  </header>
  <div class="notice-bar">
    <span>💡 <strong>좌측 김프축 (<span class="kimp-tag">핑크선 %</span>):</strong> 아래 볼륨 패널에 김프선이 표시되며, 좌측 축 너비가 메인/볼륨에 1:1 완벽 자동 정렬됩니다.</span>
    <span>💡 <strong>김프 토글:</strong> 상단 '김프' 버튼을 껐다 켜보세요. 좌측 축이 사라지고 나타날 때 덜컹거림 없이 상하가 동시에 확장/축소됩니다.</span>
    <span>💡 <strong>분할선 조절:</strong> 캔들과 볼륨 사이의 구분선을 마우스로 위아래로 끌어 높이를 조절해 보세요.</span>
  </div>

  <div id="chart-container"></div>

  <script>
    const container = document.getElementById('chart-container');
    let isKimchiVisible = true;

    // 1. 단일 차트 인스턴스 생성 (createChart 1개)
    const chart = LightweightCharts.createChart(container, {
      layout: {
        background: { color: "#0b0e14" },
        textColor: "#94a3b8",
        fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
      },
      grid: {
        vertLines: { color: "rgba(255, 255, 255, 0.05)" },
        horzLines: { color: "rgba(255, 255, 255, 0.05)" },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
      },
      timeScale: {
        borderColor: "rgba(255, 255, 255, 0.1)",
        timeVisible: true,
      },
      rightPriceScale: {
        borderColor: "rgba(255, 255, 255, 0.1)",
        autoScale: true,
      },
      leftPriceScale: {
        borderColor: "rgba(255, 255, 255, 0.1)",
        visible: true,
        autoScale: true,
      },
      autoSize: true,
    });

    // 2. Pane 0: 메인 캔들스틱 구역 (72% 높이)
    const firstPane = chart.panes()[0];
    const candleSeries = firstPane.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: "#ef4444",
      downColor: "#3b82f6",
      wickUpColor: "#ef4444",
      wickDownColor: "#3b82f6",
      borderVisible: false,
    });

    // 3. Pane 1: 하단 거래량 구역 (28% 높이) - 트뷰 v5 네이티브 구역 분리
    const volPane = chart.addPane();
    const volumeSeries = volPane.addSeries(LightweightCharts.HistogramSeries, {
      color: "#64748b",
      priceFormat: { type: 'volume' },
      priceScaleId: 'right',
    });

    // 4. Pane 1의 좌측 축에 김프(Kimchi Premium) 라인 시리즈 추가! (Sellnance와 동일 구조)
    const kimchiSeries = volPane.addSeries(LightweightCharts.LineSeries, {
      priceScaleId: 'left',
      color: '#ff007a',
      lineWidth: 2,
      crosshairMarkerVisible: true,
      priceFormat: {
        type: 'custom',
        minMove: 0.01,
        formatter: (p) => (p > 0 ? '+' : '') + p.toFixed(2) + '%',
      },
    });

    // 구역 높이 비율 설정 (메인 72% : 볼륨/김프 28%)
    firstPane.setStretchFactor(0.72);
    volPane.setStretchFactor(0.28);

    // 샘플 데이터 생성기 (캔들, 거래량, 김프 3종 세트 생성)
    function generateMarketData(basePrice, precision = 0, count = 160) {
      const candles = [];
      const volumes = [];
      const kimchis = [];

      let time = Math.floor(Date.now() / 1000) - count * 900;
      let price = basePrice;
      let kimp = 1.25; // 1.25% 기준

      for (let i = 0; i < count; i++) {
        time += 900;
        const volatility = basePrice * 0.014;
        const delta = (Math.random() - 0.49) * volatility;
        const open = price;
        const close = open + delta;
        const high = Math.max(open, close) + Math.random() * volatility * 0.5;
        const low = Math.min(open, close) - Math.random() * volatility * 0.5;
        price = close;

        const vol = Math.floor((Math.random() * 50 + 10) * (basePrice > 100000 ? 5 : 500000));
        const isUp = close >= open;

        // 김프 자연스러운 변동 (-0.2% ~ +2.8%)
        kimp += (Math.random() - 0.5) * 0.12;
        if (kimp < -0.3) kimp = -0.1;
        if (kimp > 2.8) kimp = 2.6;

        candles.push({
          time: time,
          open: Number(open.toFixed(precision)),
          high: Number(high.toFixed(precision)),
          low: Number(low.toFixed(precision)),
          close: Number(close.toFixed(precision)),
        });

        volumes.push({
          time: time,
          value: vol,
          color: isUp ? "rgba(239, 68, 68, 0.4)" : "rgba(59, 130, 246, 0.4)",
        });

        kimchis.push({
          time: time,
          value: Number(kimp.toFixed(2)),
        });
      }
      return { candles, volumes, kimchis };
    }

    const coinConfigs = {
      BTC: { price: 142500000, precision: 0 },
      DOGE: { price: 245.5, precision: 1 },
      SHIB: { price: 0.0245, precision: 4 },
    };

    let activeCoin = 'BTC';
    let currentKimp = 1.25;

    function switchCoin(coin) {
      activeCoin = coin;
      document.querySelectorAll('.coin-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + coin.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');

      const conf = coinConfigs[coin];
      const data = generateMarketData(conf.price, conf.precision, 160);

      // 정밀도 옵션 갱신
      candleSeries.applyOptions({
        priceFormat: {
          type: 'price',
          precision: conf.precision,
          minMove: 1 / Math.pow(10, conf.precision),
        }
      });

      // 4. 데이터 주입: 외부 동기화 계산 없이 데이터만 넣으면 트뷰가 좌/우 축을 0ms 완벽 자동 동기화!
      candleSeries.setData(data.candles);
      volumeSeries.setData(data.volumes);
      if (isKimchiVisible) {
        kimchiSeries.setData(data.kimchis);
      } else {
        kimchiSeries.setData([]);
      }
      currentKimp = data.kimchis[data.kimchis.length - 1].value;
      chart.timeScale().fitContent();
    }

    // 김프 토글 기능
    function toggleKimchi() {
      isKimchiVisible = !isKimchiVisible;
      const btn = document.getElementById('btn-kimp');
      if (isKimchiVisible) {
        btn.classList.add('active');
        btn.innerHTML = `<span style="font-size:11px;">●</span> 김프 (KIMP) 표시 중`;
        chart.applyOptions({
          leftPriceScale: { visible: true },
        });
        const conf = coinConfigs[activeCoin];
        const data = generateMarketData(conf.price, conf.precision, 160);
        kimchiSeries.setData(data.kimchis);
      } else {
        btn.classList.remove('active');
        btn.innerHTML = `<span style="font-size:11px;">○</span> 김프 (KIMP) 숨김`;
        kimchiSeries.setData([]);
        chart.applyOptions({
          leftPriceScale: { visible: false },
        });
      }
    }

    // 초기 BTC 로드
    switchCoin('BTC');

    // 실시간 틱 수신 시뮬레이션 (1.2초마다 가격 + 김프 동시 갱신)
    setInterval(() => {
      const conf = coinConfigs[activeCoin];
      const now = Math.floor(Date.now() / 1000);
      const randDelta = (Math.random() - 0.49) * conf.price * 0.003;
      const curPrice = Number((conf.price + randDelta).toFixed(conf.precision));

      candleSeries.update({
        time: now - (now % 900),
        close: curPrice,
        high: curPrice + (conf.price * 0.001),
        low: curPrice - (conf.price * 0.001),
        open: curPrice,
      });

      if (isKimchiVisible) {
        currentKimp += (Math.random() - 0.5) * 0.02;
        kimchiSeries.update({
          time: now - (now % 900),
          value: Number(currentKimp.toFixed(2)),
        });
      }
    }, 1200);
  </script>
</body>
</html>
